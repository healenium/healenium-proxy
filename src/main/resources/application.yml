  port: ${SPRING_SERVER_PORT:8085}
  # Enable forwarded headers Spring Boot for link generation
  forward-headers-strategy: framework

proxy:
  test:
    # selenium, playwright
    platform: ${TEST_PLATFORM:selenium}
  selenium:
    url: ${SELENIUM_SERVER_URL:http://localhost:4444/wd/hub}
#    url: ${SELENIUM_SERVER_URL:https://healenium:mobitru_ak_inyL1yfB81HAIZATY8Leuu_Z96wGcc8Eya9h0sTN62KOyv6zwKL7H45cCOHLxCa7wYbnnHEf99A7zsib1Sl@browserhub-us.mobitru.com/wd/hub}
    basic-auth: "aGVhbGVuaXVtOm1vYml0cnVfYWtfaW55TDF5ZkI4MUhBSVpBVFk4TGV1dV9aOTZ3R2NjOEV5YTloMHNUTjYyS095djZ6d0tMN0g0NWNDT0hMeENhN3dZYm5uSEVmOTlBN3pzaWIxU2w="
  healenium:
    container:
      url: ${HEALENIUM_SERVICE:http://localhost:7878}
    server:
      url: ${HEALENIUM_SERVER_URL:http://localhost:7878}
  imitate:
    container:
      url: ${IMITATE_SERVICE:http://localhost:8000}
  ai:
    container:
      url: ${HEALENIUM_AI_SERVICE:http://localhost:6565}
  playwright:
    container:
      url: ${PLAYWRIGHT_PROXY_SERVICE:http://localhost:8095}

spring:
  banner:
    location: /images/banner.txt
  jmx:
    enabled: false
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
                allowedMethods: "*"
                allowedHeaders: "*"
                maxAge: 3600
          routes:
            - id: selenium_session
              uri: ${proxy.selenium.url}
              predicates:
                - Path=/session,/wd/hub/session
              filters:
                - name: InitSession

            - id: selenium_element
              uri: http://localhost:${server.port}
              predicates:
                - Path=/session/{session_id}/element,/wd/hub/session/{session_id}/element
              filters:
                - name: FindElementRequest

            - id: selenium_child_element
              uri: http://localhost:${server.port}
              predicates:
                - Path=/session/{session_id}/element/{parent_element_id}/element,/wd/hub/session/{session_id}/element/{parent_element_id}/element
              filters:
                - name: FindElementRequest

            - id: selenium_elements
              uri: http://localhost:${server.port}
              predicates:
                - Path=/session/{session_id}/elements,/wd/hub/session/{session_id}/elements
              filters:
                - name: FindElementsRequest

            - id: selenium_child_elements
              uri: http://localhost:${server.port}
              predicates:
                - Path=/session/{session_id}/element/{parent_element_id}/elements,/wd/hub/session/{session_id}/element/{parent_element_id}/elements
              filters:
                - name: FindElementsRequest

            - id: selenium_execute_sync
              uri: ${proxy.selenium.url}
              predicates:
                - Path=/session/{session_id}/execute/sync,/wd/hub/session/{session_id}/execute/sync
                - Method=POST
              filters:
                - name: ExecuteScript

            - id: hlm_proxy_actuator
              uri: http://localhost:${server.port}
              predicates:
                - Path=/hlm-proxy/actuator,/hlm-proxy/actuator/**
              filters:
                - StripPrefix=1
                - AddRequestHeader=X-Forwarded-Prefix, /hlm-proxy

            # Local proxy controllers (/me, settings, logs) — before catch-all Selenium fallback
            - id: hlm_proxy_local
              uri: http://localhost:${server.port}
              predicates:
                - Path=/hlm-proxy/**

            - id: healenium_actuator
              uri: ${proxy.healenium.container.url}
              predicates:
                - Path=/healenium/actuator/**
              filters:
                - StripPrefix=1
                - AddRequestHeader=X-Forwarded-Prefix, /healenium

            - id: healenium_backend
              uri: ${proxy.healenium.container.url}
              predicates:
                - Path=/healenium/**,/screenshots/**

            - id: healenium_ai
              uri: ${proxy.ai.container.url}
              predicates:
                - Path=/healenium-ai/**
              metadata:
                response-timeout: 600000
                connect-timeout: 10000

            - id: playwright_proxy_actuator
              uri: ${proxy.playwright.container.url}
              predicates:
                - Path=/hlm-playwright-proxy/actuator/**
              filters:
                - StripPrefix=1
                - AddRequestHeader=X-Forwarded-Prefix, /hlm-playwright-proxy

            - id: playwright_proxy
              uri: ${proxy.playwright.container.url}
              predicates:
                - Path=/hlm-playwright-proxy/**

            - id: fallback_route
              uri: ${proxy.selenium.url}
              predicates:
                - Path=/**

healing:
  healenabled: ${HEAL_ENABLED:true}
  recoverytries: ${RECOVERY_TRIES:1}
  scorecap: ${SCORE_CAP:.6}
  selectortype: ${SELECTOR_TYPE:cssSelector}

healenium:
  auth:
    # When true, Cognito JWT is required for /healenium/** and /hlm-proxy/me
    enabled: ${HEALENIUM_AUTH_ENABLED:false}
    cognito-domain: ${COGNITO_DOMAIN:}
    client-id: ${COGNITO_CLIENT_ID:}
    logout-uri: ${COGNITO_LOGOUT_URI:}
    default-tenant-id: ${DEFAULT_TENANT_ID:}
  m2m:
    internal-token: ${M2M_INTERNAL_TOKEN:}
  membership:
    cache-ttl: PT5M
    cache-max-size: 10000

logging:
  level:
    ROOT: ${SPRING_LOG_LEVEL:INFO}
    org.springframework: INFO
    org.mongodb.driver.connection: WARN
    healenium: ${HLM_LOG_LEVEL:debug}
    com.epam.healenium.appium: ${HLM_LOG_LEVEL:debug}
    org.springframework.security: INFO
    org.springframework.web.reactive.function.client: INFO
    org.springframework.cloud.gateway: ${SPRING_LOG_LEVEL:INFO}
    reactor.netty: ${SPRING_LOG_LEVEL:INFO}
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%t] %-40.40logger{39} : %m%n%wEx'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%t] %-40.40logger{39} : %m%n%wEx'
  file:
    name: ./logs/healenium-proxy.log
  logback:
    rollingpolicy:
      file-name-pattern: ./logs/healenium-proxy-%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 1MB
      max-history: 1
      total-size-cap: 100MB

